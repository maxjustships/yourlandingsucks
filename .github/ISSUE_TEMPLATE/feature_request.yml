name: Feature request
description: Propose an evidence rule, adapter, or agent-workflow improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What public-page or agent-loop failure is not handled today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence contract
      description: What deterministic evidence should support the behavior, and how can a fixture prove it?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Trust-boundary impact
      description: Does this need new network, filesystem, repository, analytics, or credential access?
    validations:
      required: true
